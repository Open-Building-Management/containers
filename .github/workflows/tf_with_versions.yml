name: tflite amd/arm64 build with versions

on:
  workflow_dispatch:
    inputs:
      ubuntu_version:
        description: 'ubuntu version'
        required: true
        type: string
        default: '22.04'
      tflite:
        description: 'tflite version'
        required: true
        type: string
        default: '2.13.0'
      numpy:
        description: 'numpy version'
        required: true
        type: string
        default: '1.26.4'
      paho:
        description: 'paho mqtt version'
        required: true
        type: string
        default: '2.1.0'
      pymodbus:
        description: 'pymodbus version'
        required: true
        type: string
        default: '3.6.8'
      pyfina:
        description: 'pyfina version'
        required: true
        type: string
        default: '0.0.6'
      base_tag:
        description: 'tf, tf_multiarch ? ...'
        required: true
        type: string
        default: 'tf_multiarch'

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      -
        name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        id: tag
        name: create tag
        run: |
          t0=ubuntu${{ inputs.ubuntu_version }}
          t1=_numpy${{ inputs.numpy }}
          t2=_tflite${{ inputs.tflite }}
          t3=_paho${{ inputs.paho }}
          t4=_pymodbus${{ inputs.pymodbus}}
          echo $t0
          echo $t1
          echo "tag=$t0$t1$t2$t3$t4" >> "$GITHUB_OUTPUT"
      -
        name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: tf/.
          platforms: linux/amd64,linux/arm64
          build-args: |
            "BUILD_FROM=ubuntu:${{ inputs.ubuntu_version }}"
            "PYMODBUS_VERSION=${{ inputs.pymodbus}}"
            "PAHO_VERSION=${{ inputs.paho }}"
            "NUMPY_VERSION=${{ inputs.numpy }}"
            "TFLITE_VERSION=${{ inputs.tflite }}"
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ inputs.base_tag }}:${{ steps.tag.outputs.tag }}
